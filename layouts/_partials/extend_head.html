{{- /* 由 Tsz 定制：文件夹上下文 / 隐藏面包屑 / 列表按文件夹过滤 */ -}}
<script>
(function () {
  var path = location.pathname;
  var m = path.match(/^\/posts\/([^\/]+)\//);
  var folder = m ? m[1] : null;
  var q = new URLSearchParams(location.search);
  var scope = q.get('f') || folder;

  function applyMenu() {
    if (!folder) return;
    var links = document.querySelectorAll('#menu a[href], .menu a[href]');
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      var p;
      try { p = new URL(a.href, location.origin).pathname; } catch (e) { continue; }
      if (p === '/posts/' || p === '/posts') {
        a.setAttribute('href', '/posts/' + folder + '/');
      } else if (p === '/tags/' || p === '/tags') {
        a.setAttribute('href', '/tags/?f=' + folder);
      } else if (p === '/archives/' || p === '/archives') {
        a.setAttribute('href', '/archives/?f=' + folder);
      }
    }
  }

  function filterList() {
    if (!scope) return;
    if (!/^\/(tags|archives)/.test(path)) return;
    var items = document.querySelectorAll('article.post-entry, article.archive-entry, .archive-entry, .post-entry, li');
    for (var i = 0; i < items.length; i++) {
      var el = items[i];
      var a = el.querySelector('a[href*="/posts/"]');
      if (!a) continue;
      if ((a.getAttribute('href') || '').indexOf('/posts/' + scope + '/') < 0) el.style.display = 'none';
    }
    var bar = document.createElement('div');
    bar.className = 'folder-scope-bar';
    bar.innerHTML = '只看文件夹：<b>' + decodeURIComponent(scope) + '</b> · <a href="' + path + '">查看全部</a>';
    var main = document.querySelector('main.main');
    if (main) main.insertBefore(bar, main.firstChild);
  }

  document.addEventListener('DOMContentLoaded', function () {
    applyMenu();
    filterList();
  });
})();
</script>
<style>
.breadcrumbs, #breadcrumbs { display: none; }
.folder-scope-bar { margin: 10px 0 18px; padding: 8px 14px; border-radius: 10px; background: var(--entry); border: 1px solid var(--border); font-size: 13px; color: var(--secondary); }
.folder-scope-bar a { color: var(--primary); }
</style>
