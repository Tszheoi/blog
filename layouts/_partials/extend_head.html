{{- /* Tsz 定制：文件夹上下文 / 隐藏面包屑 / 标签与归档按文件夹过滤 */ -}}
<script>
(function () {
  var path = location.pathname;
  var mm = path.match(/^\/posts\/([^\/]+)\//);
  var folder = mm ? mm[1] : null;
  var q = new URLSearchParams(location.search);
  var scope = q.get('f') || folder;

  function scopeMenu() {
    if (!folder) return;
    var links = document.querySelectorAll('#menu a, ul.menu a');
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      var p;
      try { p = new URL(a.href, location.origin).pathname; } catch (e) { continue; }
      if (p === '/posts/' || p === '/posts') a.setAttribute('href', '/posts/' + folder + '/');
      else if (p === '/tags/' || p === '/tags') a.setAttribute('href', '/tags/?f=' + folder);
      else if (p === '/archives/' || p === '/archives') a.setAttribute('href', '/archives/?f=' + folder);
    }
  }

  function bar(text) {
    var d = document.createElement('div');
    d.className = 'folder-scope-bar';
    d.innerHTML = text;
    var main = document.querySelector('main.main');
    if (main) main.insertBefore(d, main.firstChild);
  }

  // 归档：隐藏不属于本文件夹的条目
  function filterArchives() {
    if (!scope || !/^\/archives/.test(path)) return;
    var items = document.querySelectorAll('.archive-entry, article, li');
    var hidden = 0;
    for (var i = 0; i < items.length; i++) {
      var el = items[i];
      var a = el.querySelector('a[href*="/posts/"]');
      if (!a) continue;
      if ((a.getAttribute('href') || '').indexOf('/posts/' + scope + '/') < 0) { el.style.display = 'none'; hidden++; }
    }
    bar('只看文件夹：<b>' + decodeURIComponent(scope) + '</b> · <a href="/archives/">查看全部</a>');
  }

  // 标签：用该文件夹的 index.json 反查真实存在的标签，再筛掉其它标签
  function filterTags() {
    if (!scope || !/^\/tags/.test(path)) return;
    bar('只看文件夹：<b>' + decodeURIComponent(scope) + '</b> · <a href="/tags/">查看全部</a>');
    fetch('/posts/' + scope + '/index.json').then(function (r) { return r.json(); }).then(function (list) {
      var tags = {};
      for (var i = 0; i < list.length; i++) {
        var t = list[i].tags || [];
        for (var j = 0; j < t.length; j++) tags[String(t[j]).toLowerCase()] = 1;
      }
      var items = document.querySelectorAll('ul.terms-tags li, .terms-tags li');
      var kept = 0;
      for (var k = 0; k < items.length; k++) {
        var li = items[k];
        var a = li.querySelector('a');
        if (!a) continue;
        var name = (a.textContent || '').trim().split(/\s/)[0].toLowerCase();
        if (tags[name]) { kept++; } else { li.style.display = 'none'; }
      }
      if (kept === 0) {
        var empty = document.createElement('p');
        empty.textContent = '这个文件夹里还没有标签';
        var main = document.querySelector('main.main');
        if (main) main.appendChild(empty);
      }
    }).catch(function () {});
  }

  document.addEventListener('DOMContentLoaded', function () {
    scopeMenu();
    filterArchives();
    filterTags();
  });
})();
</script>
<style>
.breadcrumbs, #breadcrumbs { display: none; }
.folder-scope-bar { margin: 10px 0 18px; padding: 8px 14px; border-radius: 10px; background: var(--entry); border: 1px solid var(--border); font-size: 13px; color: var(--secondary); }
.folder-scope-bar a { color: var(--primary); }
</style>
